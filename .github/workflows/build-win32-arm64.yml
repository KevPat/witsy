
# .github/workflows/build-win32-arm64.yml
name: Build Windows arm64 Release
on:
  workflow_dispatch:
jobs:
  build-win32-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: write
    steps:
      - name: Github checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: get-package-version
        id: package-version
        uses: beaconbrigade/package-json-version@v0.3.2
      - name: Install Dependencies
        run: npm ci
        env:
          PREBUILDS_ONLY: "1"
      - name: Verify native binary architectures
        run: node ./build/check_native_architecture.mjs --platform win32 --arch arm64
      - name: Check DigiCert signing secrets
        id: signing
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        shell: bash
        run: |
          missing=0
          for name in SM_HOST SM_API_KEY SM_CLIENT_CERT_PASSWORD SM_CODE_SIGNING_CERT_SHA1_HASH SM_CLIENT_CERT_FILE_B64; do
            if [ -z "${!name}" ]; then missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DigiCert certificate is not configured. The Windows arm64 package will be unsigned."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup DigiCert Code Signing Tools
        id: digicert
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        uses: digicert/ssm-code-signing@v1.0.0
      - name: Setup Certificate
        id: certfile
        if: steps.signing.outputs.enabled == 'true' && steps.digicert.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
      - name: Set DigiCert Environment Variables
        if: steps.signing.outputs.enabled == 'true' && steps.certfile.outcome == 'success'
        shell: bash
        run: |
          echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$GITHUB_ENV"
          echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Sync Certificates
        id: certsync
        if: steps.signing.outputs.enabled == 'true' && steps.certfile.outcome == 'success'
        continue-on-error: true
        run: smctl windows certsync
        shell: cmd
      - name: Enable signing
        if: steps.certsync.outcome == 'success'
        shell: bash
        run: echo "SM_CODE_SIGNING_CERT_SHA1_HASH=${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}" >> "$GITHUB_ENV"
      - name: Build script
        run: ./build/build.ps1
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          PREBUILDS_ONLY: "1"
      - name: List packages
        uses: mathiasvr/command-output@v2.0.0
        id: packagelist
        with:
          run: node ./build/list_packages.mjs
      - name: Publish Release
        run: gh release upload v${{ steps.package-version.outputs.version}} ${{ steps.packagelist.outputs.stdout }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
