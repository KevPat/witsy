# .github/workflows/release.yml
name: Test app
on:
  push:
  pull_request:
jobs:
  quality:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: win32
            arch: x64
            runner: windows-latest
          - platform: win32
            arch: arm64
            runner: windows-11-arm
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Github checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libevdev-dev
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip
        env:
          PREBUILDS_ONLY: "1"
      - name: Verify native binary architectures
        run: node ./build/check_native_architecture.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Run lint
        run: npm run lint
      - name: Run tests
        id: test
        shell: bash
        run: |
          set -o pipefail
          npx vitest --run --coverage.enabled=true --coverage.reporter=json --coverage.reporter=text-summary --silent=true 2>&1 | tee test-output.txt
          echo "SUMMARY=$(tail -5 test-output.txt | head -1)" > $GITHUB_OUTPUT
      - name: Capture coverage
        id: coverage
        if: matrix.platform == 'darwin' && matrix.arch == 'arm64'
        shell: bash
        run: |
          SUMMARY="${{ steps.test.outputs.SUMMARY }}"
          TOKENS=($SUMMARY)
          echo "COVERAGE=$(echo ${TOKENS[2]})" > $GITHUB_OUTPUT
      - name: Record coverage history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.platform == 'darwin' && matrix.arch == 'arm64'
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
          GIST_ID: "fee06adf8df838e499209254e61da7f6"
        run: |
          gh gist view $GIST_ID -f coverage-history.json > coverage-history.json 2>/dev/null || echo "[]" > coverage-history.json
          node tools/coverage_record.js
          gh gist edit $GIST_ID -a coverage-history.json
      - name: Create coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.platform == 'darwin' && matrix.arch == 'arm64'
        uses: schneegans/dynamic-badges-action@b90feefcb07693386596d07ff4b7b7f0c6e99bff # v1.0.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 8febadb1ecb32078db4c003d0c09f565
          filename: witsy__main.json
          label: Coverage
          message: ${{ steps.coverage.outputs.COVERAGE }}
          labelColor: rgb(61, 70, 78)
          logoColor: rgb(255, 255, 255)
          color: rgb(51, 203, 85)
          namedLogo: vitest

  package-windows-x64:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Github checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
        env:
          PREBUILDS_ONLY: "1"
      # Same certificate as the signed v3.5.2 Setup.exe: CN=Kochava Inc.,
      # SHA1 5DABFFF2455B1937D25EA3B51CFC8E5EC508CAFC.
      # build-win32-x64.yml loads it with smctl. forge.config.ts signWithParams
      # and build/sign_binaries.ts signWindowsBinaries then use
      # SM_CODE_SIGNING_CERT_SHA1_HASH. The private key is not in this repo.
      - name: Check DigiCert signing secrets
        id: signing
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        shell: bash
        run: |
          missing=0
          for name in SM_HOST SM_API_KEY SM_CLIENT_CERT_PASSWORD SM_CODE_SIGNING_CERT_SHA1_HASH SM_CLIENT_CERT_FILE_B64; do
            if [ -z "${!name}" ]; then
              echo "Signing secret not set: $name"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DigiCert certificate is not configured. The Windows package will be unsigned."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup DigiCert Code Signing Tools
        id: digicert
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        uses: digicert/ssm-code-signing@b300bb7e8c2ab85257d660fe5b6c6374131ca2ef # v1.0.0
      - name: Setup Certificate
        id: certfile
        if: steps.signing.outputs.enabled == 'true' && steps.digicert.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
      - name: Set DigiCert Environment Variables
        if: steps.signing.outputs.enabled == 'true' && steps.certfile.outcome == 'success'
        shell: bash
        run: |
          echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
      # The DigiCert secrets go only to the two steps that talk to DigiCert:
      # smctl here, and signtool (run by forge.config.ts and build/sign_binaries.ts) in the build.
      - name: Sync Certificates
        id: certsync
        if: steps.signing.outputs.enabled == 'true' && steps.certfile.outcome == 'success'
        continue-on-error: true
        run: smctl windows certsync
        shell: cmd
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      - name: Enable installer signing
        if: steps.certsync.outcome == 'success'
        shell: bash
        run: |
          echo "WINDOWS_CODE_SIGNED=true" >> "$GITHUB_ENV"
      # Empty unless the certificates were synced: forge.config.ts and build/sign_binaries.ts
      # sign only when SM_CODE_SIGNING_CERT_SHA1_HASH is not empty.
      - name: Build Windows package
        run: ./build/build.ps1
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          SM_HOST: ${{ steps.certsync.outcome == 'success' && secrets.SM_HOST || '' }}
          SM_API_KEY: ${{ steps.certsync.outcome == 'success' && secrets.SM_API_KEY || '' }}
          SM_CLIENT_CERT_PASSWORD: ${{ steps.certsync.outcome == 'success' && secrets.SM_CLIENT_CERT_PASSWORD || '' }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ steps.certsync.outcome == 'success' && secrets.SM_CODE_SIGNING_CERT_SHA1_HASH || '' }}
      - name: Mark unsigned packages
        if: env.WINDOWS_CODE_SIGNED != 'true'
        shell: pwsh
        run: |
          $arch = $env:PROCESSOR_ARCHITECTURE.ToLower()
          if ($arch -eq 'amd64') { $arch = 'x64' }
          $dirs = @(
            "out/make/squirrel.windows/$arch",
            "out/make/zip/win32/$arch"
          )
          foreach ($dir in $dirs) {
            if (-not (Test-Path $dir)) { continue }
            Get-ChildItem $dir -File | Where-Object { $_.Extension -in '.exe', '.nupkg', '.zip' } | ForEach-Object {
              if ($_.Name -match '-unsigned(\.|$)') { return }
              if ($_.Name -like '*.Setup.exe') {
                $newName = $_.Name -replace '\.Setup\.exe$', '-unsigned.Setup.exe'
              } elseif ($_.Name -like '*-full.nupkg') {
                $newName = $_.Name -replace '-full\.nupkg$', '-full-unsigned.nupkg'
              } else {
                $newName = $_.BaseName + '-unsigned' + $_.Extension
              }
              Rename-Item $_.FullName $newName
              Write-Host "Renamed $($_.Name) -> $newName"
            }
          }
          $releases = "out/make/squirrel.windows/$arch/RELEASES"
          if (Test-Path $releases) {
            (Get-Content $releases -Raw) -replace '-full\.nupkg', '-full-unsigned.nupkg' | Set-Content $releases -NoNewline
          }
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: witsy-win32-x64
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/make/zip/win32/x64/*.zip
