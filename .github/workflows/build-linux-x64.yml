
# .github/workflows/build-linux-x64.yml
name: Build Linux x64 Release
on:
  workflow_dispatch:
jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install required packages
        run: sudo apt-get install -y rpm libevdev-dev
      - name: Github checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: get-package-version
        id: package-version
        uses: beaconbrigade/package-json-version@1da990953ac5abf189b6833724706acaae203fe4 # v0.3.2
      - name: Install required packages
        run: npm install -g node-gyp
      - name: Install Dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip
      - name: Build script
        run: make linux-x64
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          PREBUILDS_ONLY: "1"
      - name: List packages
        uses: mathiasvr/command-output@34408ea3d0528273faff3d9e201761ae96106cd0 # v2.0.0
        id: packagelist
        with:
          run: node ./build/list_packages.mjs
      - name: Publish Release
        run: gh release upload v${{ steps.package-version.outputs.version}} ${{ steps.packagelist.outputs.stdout }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
