name: Build Linux arm64 Release
on:
  workflow_dispatch:
jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y rpm libevdev-dev
      - name: Github checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: get-package-version
        id: package-version
        uses: beaconbrigade/package-json-version@v0.3.2
      - name: Install node-gyp
        run: npm install -g node-gyp
      - name: Install Dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip
      - name: Verify native binary architectures
        run: node ./build/check_native_architecture.mjs --platform linux --arch arm64
      - name: Build script
        run: make linux-arm64
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          PREBUILDS_ONLY: "1"
      - name: List packages
        uses: mathiasvr/command-output@v2.0.0
        id: packagelist
        with:
          run: node ./build/list_packages.mjs
      - name: Publish Release
        run: gh release upload v${{ steps.package-version.outputs.version}} ${{ steps.packagelist.outputs.stdout }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
